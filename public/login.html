        <div class="container">

            <div class="painel-direito">
                <div class="formulario">
                    <p class="bem_vindo">Bem-vindo de volta!</p>

                    <p class="campos">E-mail</p>
                    <input type="text" id="email_ipt" class="campos_input">

                    <p class="campos">Senha</p>
                    <input type="password" id="senha_ipt" class="campos_input">

                    <div id="login_efetuado"></div>
                    <div id="login_negado"></div>
                    <button class="botao_entrar" onclick="entrar()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

<script>

let tentativas = 3

function entrar() {
    let senha = senha_ipt.value
    let email = email_ipt.value

    if (tentativas <= 0) {
        alert(`Acesso bloqueado!`)
        login_negado.innerHTML = `Login bloqueado!`
        return;
    }

    let valores = [email, senha];
    let mensagens = [`Insira um e-mail no campo E-MAIL!`, `Insira uma senha no campo SENHA!`];

    for (let i = 0; i < valores.length; i++) {
        if (valores[i].length == 0) {
            alert(mensagens[i]);
            return;
        }
    }

    if (!email.includes("@")) {
        alert(`Seu E-MAIL precisa conter "@"!`)
    }

    else if (senha != senha) {
        tentativas--

        if (tentativas == 0) {
            alert(`Acesso bloqueado! Você esgotou suas tentativas.`)
            login_negado.innerHTML = `Login bloqueado!`
        }
        else {
            alert(`Senha incorreta! Restam ${tentativas} tentativas.`)
        }
    }

    else if (senha == senha) {
        login_efetuado.innerHTML = `Login efetuado com sucesso!`
        tentativas = 3
        
        console.log("FORM LOGIN: ", email);
        console.log("FORM SENHA: ", senha);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;

                    window.location.href = "teste.html";
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

        
}


</script>
