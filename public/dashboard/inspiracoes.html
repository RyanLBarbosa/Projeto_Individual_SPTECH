//Guarda o fotógrafo e a fotografia atualmente selecionados
let fotografoAtual = 0;
let fotoAtual = 0;


//CARREGA OS BOTÕES DOS FOTÓGRAFOS
function carregarBotoes() {

    const filtros = document.getElementById("filtros-fotografos");

    filtros.innerHTML = "";

    inspiracoes.forEach((fotografo, indice) => {

        const botao = document.createElement("button");

        botao.className = "filtro";
        botao.innerText = fotografo.nome;

        botao.addEventListener("click", () => {
            carregarFotografo(indice);
        });
        filtros.appendChild(botao);

    });

}


//CARREGA AS INFORMAÇÕES DO FOTÓGRAFO
function carregarFotografo(indice) {

    fotografoAtual = indice;

    fotoAtual = 0;

    const fotografo = inspiracoes[fotografoAtual];

    //Atualiza os botões
    const botoes = document.querySelectorAll(".filtro");

    botoes.forEach((botao, i) => {
        botao.classList.toggle("ativo", i === indice);
    });


    //Atualiza as informações
    document.getElementById("nome-fotografo").innerText =
        fotografo.nome;

    document.getElementById("categoria-fotografo").innerText =
        fotografo.categoria;

    document.getElementById("descricao-fotografo").innerText =
        fotografo.descricao;

    document.getElementById("biografia-fotografo").innerText =
        fotografo.biografia;

    //Atualiza a galeria
    carregarGaleria();

    //Exibe a primeira fotografia
    trocarFoto(0);

}

//CARREGA AS MINIATURAS DA GALERIA
function carregarGaleria() {

    const galeria = document.getElementById("galeria-fotos");

    const fotografo = inspiracoes[fotografoAtual];

    galeria.innerHTML = "";

    fotografo.fotos.forEach((foto, indice) => {

        const miniatura = document.createElement("button");

        miniatura.className = "miniatura";

        miniatura.innerHTML = `
            <img src="${foto.caminho}" alt="${foto.legenda}">
            <span class="numero-miniatura">
                ${String(indice).padStart(2, "0")}
            </span>
        `;

        miniatura.addEventListener("click", () => {

            trocarFoto(indice);

        });
        galeria.appendChild(miniatura);
    });

}


//Troca de fotografo
function trocarFoto(indice) {

    fotoAtual = indice;

    const fotografo = inspiracoes[fotografoAtual];

    const foto = fotografo.fotos[fotoAtual];

    //troca a imagem principal
    document.getElementById("foto-destaque").src = foto.caminho;

    //atualiza o texto da imagem
    document.getElementById("foto-destaque").alt = foto.legenda;

    //legenda da foto
    document.getElementById("legenda-foto").innerText = foto.legenda;

    //destaca a miniatura selecionada
    const miniaturas = document.querySelectorAll(".miniatura");

    miniaturas.forEach((miniatura, i) => {

        miniatura.classList.toggle("ativo", i === indice);

    });

}

//inicialização da página
carregarBotoes();
