<!DOCTYPE html>

<!--
Fluxo:
-Adicionar foto
-Preencher informações
-Salvar (cria um objeto com as informações -> JSON)
-Exibir na galeria
-Visualizar detalhes
-Excluir

PRINCIPAL - 3 coisas:
1.	Lista que armazena as fotos
2.	Funções que manipulam essa lista
3.	Funções que atualizam o que aparece na tela
-->

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="../css/style_galeria.css">
</head>

<body>
    <aside class="barra-lateral">
        <div class="logo">
            <img src="../assets/LENZ.png" alt="Logotipo">
        </div>

        <p class="saudacao">Olá, usuário</p>

        <nav class="navegacao">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#inspiracoes">Inspirações</a></li>
                <li><a href="../dashboard/galeria.html" class="ativo">Galeria</a></li>
                <li><a href="../acesso.html">Dashboard</a></li>
            </ul>
        </nav>

        <div class="botoes">
            <a href="index.html" class="sair">
                Sair
                <img src="?" alt="icon-sair">
            </a>
        </div>
    </aside>

    <!-- Envoltório adicionado apenas para empurrar a galeria para o lado da barra lateral -->
    <main class="conteudo-galeria">
        <div class="header-galeria">
            <h1>Minha Galeria</h1>

            <!--Ao clicar, ele vai chamar a função escrita no OnClick-->
            <button class="btn-adicionar" onclick="abrirSeletorDeArquivo()">+ Adicionar Foto</button>


            <input type="file" id="inputArquivo" accept="image/*" style="display: none;"
                onchange="arquivoSelecionado(event)">
            <!--
            type="file": transforma o input em um seletor de arquivos.
            id="inputArquivo": dá um identificador para o JavaScript encontrar esse elemento.
            accept="image/*": indica que queremos selecionar imagens.
            display: none: esconde o input da tela.
            O onchange é um evento que detecta uma alteração no elemento. Nesse caso, quando você escolhe um arquivo.
            -->

        </div>

        <!-- Grade da Galeria -->
        <div class="galeria-grid" id="galeriaContainer"></div>
    </main>

    <!-- MODAL 1: Adicionar Nova Foto -->
    <div class="modal-overlay" id="modalUpload">
        <div class="modal-card">
            <button class="btn-fechar" onclick="fecharModalUpload()" title="Cancelar">&times;</button>
            <h3>Detalhes da Foto</h3>

            <div class="preview-box">
                <img id="imgPreview" src="" alt="Pré-visualização">
            </div>

            <div class="campo">
                <label for="selectCategoria">Categoria:</label>
                <select id="selectCategoria">
                    <option value="1">Foto de Rua</option>
                    <option value="2">Paisagem e Ambiente</option>
                    <option value="3">Retrato</option>
                    <option value="4">Moda</option>
                    <option value="5">Esportiva</option>
                </select>
            </div>

            <div class="campo">
                <label for="inputDescricao">Descrição:</label>
                <textarea id="inputDescricao" placeholder="Conte um pouco sobre essa foto..."></textarea>
            </div>

            <div class="data-hora-info" id="textoDataHora">
                Adicionada em: --/--/---- às --:--
            </div>

            <button class="btn-salvar" onclick="salvarNaGaleria()">Salvar</button>
        </div>
    </div>

    <!-- MODAL 2: Visualizar Detalhes e Excluir -->
    <div class="modal-overlay" id="modalDetalhes">
        <div class="modal-card detalhes">
            <button class="btn-fechar" onclick="fecharModalDetalhes()" title="Fechar">&times;</button>

            <div class="detalhe-img-box">
                <img id="detalheImg" src="" alt="Foto Ampliada">
            </div>

            <span class="badge-categoria" id="detalheCategoria">Categoria</span>
            <p class="foto-descricao-completa" id="detalheDescricao">Descrição completa aqui...</p>
            <span class="foto-data" id="detalheData">Adicionada em...</span>

            <button class="btn-excluir" id="btnConfirmarExclusao">Excluir Foto</button>
        </div>
    </div>
</body>

</html>

<script>

    //Variaveis globais
    let listaFotos = []; //Serve como uma memoria temporaria, guarda fotos
    let arquivoSelecionadoObjeto = null; //Guarda temporariamente o arquivo bruto da foto selecionada até que ele salve

    window.onload = function () {
        const idUsuario = sessionStorage.ID_USUARIO;
        const nomeUsuario = sessionStorage.NOME_USUARIO;

        const elementoSaudacao = document.querySelector('.saudacao');
        if (elementoSaudacao && nomeUsuario) {
            elementoSaudacao.innerText = `Olá, ${nomeUsuario}`;
        }

        if (!idUsuario) {
            alert("Você precisa fazer login para ver a dashboard!!!")
            window.location = "index.html";
            return;
        }
        renderizarGaleria();
    }; //Ativa assim que inicia a página, fazendo com que busque as fotos registradas no BD rapidamente

    function abrirSeletorDeArquivo() {
        document.getElementById('inputArquivo').click();
    } //Simula um clique no campo "input type=file" para que o usuário escolha a imagem no computador

    //Processa a pre-visualização da foto
    function arquivoSelecionado(event) {
        const arquivo = event.target.files[0]; //captura a foto que o usuário selecionou
        if (!arquivo) return;

        arquivoSelecionadoObjeto = arquivo;  //salva a foto na variavel global

        //URL temporária no navegador apenas para a pré-visualização no modal
        const previewUrl = URL.createObjectURL(arquivo);
        document.getElementById('imgPreview').src = previewUrl; //mostra a foto na tela dentro do modal de upload

        //Formatação de horario no padrão brasileiro
        const agora = new Date();
        const dataHoraAtual = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('textoDataHora').innerText = `Adicionada em: ${dataHoraAtual}`;

        //Abre a janela PopUp do Modal de confirmação do upload
        document.getElementById('modalUpload').style.display = 'flex';
    }

    //Função para fechar o modal de upload
    function fecharModalUpload() {
        document.getElementById('modalUpload').style.display = 'none';
        document.getElementById('inputArquivo').value = "";
        document.getElementById('inputDescricao').value = "";
        document.getElementById('selectCategoria').selectedIndex = 0;
        arquivoSelecionadoObjeto = null; //esconde o modal
    }

    //Envio oficial com FormData (Padrão SPTech)
    function salvarNaGaleria() {
        const categoria = document.getElementById('selectCategoria').value;
        const descricao = document.getElementById('inputDescricao').value.trim() || "Sem descrição.";
        const fk_usuario = sessionStorage.ID_USUARIO;

        if (!arquivoSelecionadoObjeto) {
            alert("Por favor, selecione uma imagem válida!");
            return;
        }

        // FormData empacota o arquivo no campo "foto" esperado pelo Multer
        const formData = new FormData();
        formData.append("foto", arquivoSelecionadoObjeto);
        formData.append("categoria", categoria);
        formData.append("descricao", descricao);
        formData.append("fk_usuario", fk_usuario);

        /*
        -FETCH: Função JS para fazer uma requisição para o servidor NodeJS
        -Coleta as informações cadastradas, e envia ao servidor NodeJS via HTTP
        -Após, envia ao multer que intercepta a foto e salva na pasta de arquivos
        -Controller pega o nome gerado pelo Multer e chama a model, que insere no BD
        -Se inserir corretamente, o servidor retorna 'Sucesso'
        -Após isso, renderiza a galeria e fecha o modal de upload
        */
        fetch("/fotos/cadastrar", {
            method: "POST",
            body: formData
        }).then(function (resposta) {
            if (resposta.status == 201) {
                renderizarGaleria();
                fecharModalUpload();
            } else {
                alert("Houve um erro ao salvar a foto!");
            }
        }).catch(function (erro) {
            console.error("Erro na requisição cadastrar:", erro);
        });
    }


    function renderizarGaleria() {
        const fk_usuario = sessionStorage.ID_USUARIO;
        const galeria = document.getElementById('galeriaContainer');

        /*
        -Dispara um GET enviando o ID do usuário no caminho
        -Se retornar 200, encontrou fotos
        -Guarda a lista de fotos na fariavel global listaFotos (lista)
        -Limpa o container da galeria
        -forEach: Percorre o array inserindo os cards de foto e puxando a foto do diretório de fotos
        */
        fetch(`/fotos/listar/${fk_usuario}`)
            .then(function (resposta) {
                if (resposta.status == 200) {
                    resposta.json().then(function (fotos) {
                        listaFotos = fotos;
                        galeria.innerHTML = "";

                        fotos.forEach(foto => {
                            galeria.innerHTML += `
                                <div class="foto-card" onclick="abrirDetalhes(${foto.idFoto})">
                                    <img src="/assets/imgs/galeria/${foto.imagem}" alt="${foto.categoria}">
                                    <div class="foto-info">
                                        <span class="badge-categoria">${foto.categoria}</span>
                                        <p class="foto-descricao">${foto.descricao}</p>
                                        <span class="foto-data">${foto.dtCaptura}</span>
                                    </div>
                                </div>`;
                        });
                    });
                } else if (resposta.status == 204) {
                    galeria.innerHTML = "<p style='color: grey; text-align: center; grid-column: 1/-1;'>Nenhuma foto cadastrada ainda.</p>";
                    listaFotos = [];
                }
            })
            .catch(function (erro) {
                console.error("Erro ao listar fotos:", erro);
            });
    }

    /*
    -Procura dentro do array a foto com o ID que o usuário clicou
    -Preenche o card com a imagem, categoria, descricao e data que foi inserida a foto
    -Atribui ao botão excluir a função de exclusao de fotos, passando o ID da foto como parametro
    -Exibe o modal na tela com display = flex
    */
    function abrirDetalhes(idFoto) {
        const foto = listaFotos.find(item => item.idFoto === idFoto);
        if (!foto) return;

        document.getElementById('detalheImg').src = `/assets/imgs/galeria/${foto.imagem}`;
        document.getElementById('detalheCategoria').innerText = foto.categoria;
        document.getElementById('detalheDescricao').innerText = foto.descricao;
        document.getElementById('detalheData').innerText = `Adicionada em: ${foto.dtCaptura}`;

        document.getElementById('btnConfirmarExclusao').onclick = function () {
            excluirFoto(foto.idFoto);
        };

        document.getElementById('modalDetalhes').style.display = 'flex';
    }

    //Fecha modal de detalhes colocando o display como none
    function fecharModalDetalhes() {
        document.getElementById('modalDetalhes').style.display = 'none';
    }

    /*Função para excluir foto pelo ID da foto
    confirm: exibe um alert no navegador perguntando se o usuário realmente deseja apagar a foto
    -Se confirmar, através do fetch, envia a requisição delete contendo o id do usuário e idfoto
    -Por fim, renderiza a galeria novamente e fecha o modal de detalhes
    */
    function excluirFoto(idFoto) {
        const confirmou = confirm("Tem certeza que deseja excluir esta foto?");
        if (!confirmou) return;

        const fk_usuario = sessionStorage.ID_USUARIO;

        fetch(`/fotos/deletar/${idFoto}/${fk_usuario}`, {
            method: "DELETE"
        }).then(function (resposta) {
            if (resposta.status == 200) {
                renderizarGaleria();
                fecharModalDetalhes();
            } else {
                alert("Erro ao excluir a foto do banco de dados!");
            }
        }).catch(function (erro) {
            console.error("Erro ao deletar foto:", erro);
        });
    }
</script>
