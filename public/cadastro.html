    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <header class="nav_bar">

        <div class="logo">
            <img src="assets/LENZ.png" alt="Logotipo">
        </div>

        <nav class="navegacao">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#projeto">O Projeto</a></li>
                <li><a href="#tempo">Tempo</a></li>
                <li><a href="#lente">Lente</a></li>
                <li><a href="#instantes">Instantes</a></li>
            </ul>
        </nav>

        <div class="botoes">
            <a href="cadastro.html"><button class="cadastro">Cadastro</button></a>
            <a href="login.html"><button class="login">Login</button></a>
        </div>
    </header>
    <div class="boxPai">
        <div class="container">
                <div class="logo">
                </div>
            <div class="painel-direito">
                <div class="formulario">
                    <p class="bem_vindo">Bem-vindo!</p>

                    <p class="campos">Nome completo</p>
                    <input type="text" id="nome_ipt" class="campos_input">

                    <p class="campos">E-mail</p>
                    <input type="text" id="email_ipt" class="campos_input">

                    <p class="campos">CPF</p>
                    <input type="text" id="CPF_ipt" class="campos_input">

                    <p class="campos">Telefone</p>
                    <input type="text" id="telefone_ipt" class="campos_input">

                    <div class="campos-senha">
                        <div>
                            <p class="campos" for="senha_ipt">Senha</p>
                            <input type="password" id="senha_ipt">
                        </div>

                        <div>
                            <p class="campos" for="confirmacao_ipt">Confirmar Senha</p>
                            <input type="password" id="confirmacao_ipt">
                        </div>
                    </div>
                    <div id="cadastro_efetuado"></div>
                    <button class="botao_conta" onclick="criar()">Criar conta</button>
                    </a>
                </div>


            </div>
        </div>
</body>

</html>
<script>

    function criar() {
        let nome = nome_ipt.value
        let email = email_ipt.value
        let senha = senha_ipt.value
        let confirmacao_senha = confirmacao_ipt.value
        let cpf = CPF_ipt.value
        let telefone = telefone_ipt.value

        let numero_validacao = (
            senha.includes('0') || senha.includes('1') ||
            senha.includes('2') || senha.includes('3') ||
            senha.includes('4') || senha.includes('5') ||
            senha.includes('6') || senha.includes('7') ||
            senha.includes('8') || senha.includes('9')
        )

        let simbolo_validacao = (
            senha.includes('?') || senha.includes('!') ||
            senha.includes('@') || senha.includes('#') ||
            senha.includes(':')
        )

        // Validação do campo NOME
        if (nome.length == 0) {
            alert(`Preencha o campo NOME!`)
        }

        // Validações do campo E-MAIL
        else if (email.length == 0) {
            alert(`Preencha o campo E-MAIL!`)
        }
        else if (!email.includes('@')) {
            alert(`Seu E-MAIL precisa incluir "@"!`)
        }

        // Validações do campo CPF
        else if (cpf.length == 0) {
            alert(`Preencha o campo CPF!`)
        }
        else if (cpf.length > 11) {
            alert(`O CPF não pode ter mais de 11 caracteres!`)
        }
        else if (cpf.length < 11) {
            alert(`O CPF não pode ter menos de 11 caracteres!`)
        }

        // Validação do campo TELEFONE
        else if (telefone.length == 0) {
            alert(`Preencha o campo TELEFONE!`)
        }

        // Validações do campo SENHA
        else if (senha.length == 0) {
            alert(`Defina uma SENHA!`)
        }
        else if (senha.length < 8) {
            alert(`Sua senha deve conter pelo menos 8 caracteres!`)
        }
        else if (senha == senha.toLowerCase()) {
            alert(`Sua senha deve conter pelo menos uma letra MAIÚSCULA!`)
        }
        else if (senha == senha.toUpperCase()) {
            alert(`Sua senha deve conter pelo menos uma letra MINÚSCULA!`)
        }
        else if (!numero_validacao) {
            alert(`Sua senha deve conter pelo menos um NÚMERO!`)
        }
        else if (!simbolo_validacao) {
            alert(`Sua senha deve conter pelo menos um CARACTERE ESPECIAL (!, ?, @, #, :)!`)
        }

        // Validações do campo CONFIRMAÇÃO DE SENHA
        else if (confirmacao_senha.length == 0) {
            alert(`Digite novamente sua senha no campo CONFIRMAÇÃO!`)
        }
        else if (senha != confirmacao_senha) {
            alert(`As senhas não correspondem!`)
        }


        // Caso todas as validações estejam corretas
else{
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nome,
        emailServer: email,
        cpfServer: cpf,
        telefoneServer: telefone,
        senhaServer: senha,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cadastro_efetuado.style.display = "block";

          cadastro_efetuado.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
    ;
      });

    return false;
  }
}

</script>
