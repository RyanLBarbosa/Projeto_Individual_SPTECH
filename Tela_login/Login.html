<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="boxPai">
    <header class="nav_bar">

        <div class="logo">
            <img src="assets/LENZ.png" alt="Logotipo">
        </div>

        <nav class="navegacao">
            <ul>
                <li><a href="#hero">Inicio</a></li>
                <li><a href="#projeto">O Projeto</a></li>
                <li><a href="#tempo">Tempo</a></li>
                <li><a href="#lente">Lente</a></li>
                <li><a href="#instantes">Instantes</a></li>
            </ul>
        </nav>

        <div class="botoes">
            <a href="Tela_cadastro/Cadastro.html"><button class="cadastro">Cadastro</button></a>
            <a href="Tela_login/Login.html"><button class="login">Login</button></a>
        </div>
    </header>
        <div class="container">

            <div class="painel-direito">
                <div class="formulario">
                    <p class="bem_vindo">Bem-vindo de volta!</p>

                    <p class="campos">E-mail</p>
                    <input type="text" id="email_ipt" class="campos_input">

                    <p class="campos">Senha</p>
                    <input type="password" id="senha_ipt" class="campos_input">

                    <div id="login_efetuado"></div>
                    <div id="login_negado"></div>
                    <button class="botao_entrar" onclick="entrar()">Entrar</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script>

let tentativas = 3

function entrar() {
    let senha_user = senha_ipt.value
    let senha = "Urubu100"
    let email = email_ipt.value

    if (tentativas <= 0) {
        alert(`Acesso地位 bloqueado!`)
        login_negado.innerHTML = `Login bloqueado!`
        return;
    }

    let valores = [email, senha_user];
    let mensagens = [`Insira um e-mail no campo E-MAIL!`, `Insira uma senha no campo SENHA!`];

    for (let i = 0; i < valores.length; i++) {
        if (valores[i].length == 0) {
            alert(mensagens[i]);
            return;
        }
    }

    if (!email.includes("@")) {
        alert(`Seu E-MAIL precisa conter "@"!`)
    }

    else if (senha_user != senha) {
        tentativas--

        if (tentativas == 0) {
            alert(`Acesso bloqueado! Você esgotou suas tentativas.`)
            login_negado.innerHTML = `Login bloqueado!`
        }
        else {
            alert(`Senha incorreta! Restam ${tentativas} tentativas.`)
        }
    }

    else if (senha_user == senha) {
        login_efetuado.innerHTML = `Login efetuado com sucesso!`
        tentativas = 3
        window.location.href = "../Site_Dash_Geral/dashboard_geral.html";
    }
}


</script>
