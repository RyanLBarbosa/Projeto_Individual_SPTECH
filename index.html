<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Barra de navegação-->
    <header class="nav_bar">

        <div class="logo">
            <a href="/">
                <img src="logo.png" alt="Logotipo">
            </a>
        </div>


        <nav class="navegacao">
            <ul>
                <li><a href="cenerio">Cenário</a></li>
                <li><a href="instante">Instante</a></li>

            <p>O RITMO DA VIDA</p>

        <button>Sinta o momento -></button>
    </div>
        <!--lado direito-->
        <div class="imagem-direita">
            <img src="assets/foto-hero.png" alt="imagem-hero">
        </div>
